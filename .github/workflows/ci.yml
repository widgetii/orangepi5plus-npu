name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'librocketnpu/**'
      - 'openrknn/**'
      - '.github/workflows/ci.yml'
  pull_request:

defaults:
  run:
    working-directory: librocketnpu

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libprotobuf-c-dev

      - name: Build library
        run: make librocketnpu.so

      - name: Build tests
        run: make test_sw_ops test_rknpu_abi test_onnx_parse test_fc

      - name: Run sw_ops tests
        run: LD_LIBRARY_PATH=. ./test_sw_ops

      - name: Run rknpu_abi tests
        run: LD_LIBRARY_PATH=. ./test_rknpu_abi

  cross-compile-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libdrm-dev

      - name: Cross-compile object files for aarch64
        run: |
          for f in src/rnpu_drm.c src/rnpu_tflite.c src/rnpu_coefs.c src/rnpu_task.c \
                   src/rnpu_regcmd.c src/rnpu_convert.c src/rnpu_sw_ops.c src/rnpu_rknn.c \
                   src/rnpu_model.c; do
            aarch64-linux-gnu-gcc -O2 -Wall -Wno-unused-function \
              -Isrc -Iinclude -march=armv8-a -fPIC -c -o /dev/null "$f"
          done

  hw-test:
    # Hardware tests on Orange Pi 5 Plus — only on push (not PRs from forks)
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: [self-hosted, orangepi5plus]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run hardware smoke tests
        run: bash tests/ci_hw_smoke.sh

  openrknn-build:
    # Cross-compile openrknn for aarch64 on the Ubuntu runner —
    # catches build breakages without needing the board.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: openrknn
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross-compile librknn_api.so for aarch64
        run: make CC=aarch64-linux-gnu-gcc

      - name: Verify shared library
        run: |
          file librknn_api.so
          aarch64-linux-gnu-objdump -T librknn_api.so | grep -E 'rknn_(init|query|run|inputs_set|outputs_get|destroy)' | sort

  openrknn-hw-test:
    # Real-image accuracy validation on Orange Pi 5 Plus — only on push.
    # Exercises the full openrknn pipeline (init, query, inputs_set, run,
    # outputs_get) with real test images and semantic post-processing
    # (softmax + top-k, YOLOv5/v8 NMS, DeepLabv3 argmax) against the
    # vendor library baseline.
    if: github.event_name == 'push'
    needs: openrknn-build
    runs-on: [self-hosted, orangepi5plus]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: openrknn
    steps:
      - uses: actions/checkout@v4

      - name: Run openrknn real-image validation
        run: bash tests/ci_validate.sh
